name: Windows MSVC

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC core and MCP build
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DPAPER_BUILD_GUI=OFF -DPAPER_BUILD_AI=ON -DPAPER_BUILD_TESTS=ON -DPAPER_WITH_ZYDIS=OFF

      - name: Build Paper core and MCP
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
